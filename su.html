
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İmparatoriçe 🫀</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a0913, #2d0b20, #0f050d);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            overflow: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 105, 180, 0.2);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 0 0 20px rgba(255, 20, 147, 0.2);
            text-align: center;
            max-width: 400px;
            width: 90%;
            transition: all 0.4s ease-in-out;
        }

        h1 {
            font-size: 28px;
            color: #ff69b4;
            margin-bottom: 15px;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255, 105, 180, 0.4);
        }

        p {
            font-size: 18px;
            color: #fce4ec;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .btn {
            background: linear-gradient(135deg, #ff1493, #ff69b4);
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 20, 147, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            margin: 5px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 20, 147, 0.6);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: none;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.1);
        }

        .button-group {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .hidden {
            display: none;
        }

        /* Küçük kalpler efekti */
        .heart {
            position: absolute;
            color: rgba(255, 105, 180, 0.4);
            font-size: 20px;
            animation: floatUp 4s linear infinite;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0.5);
                opacity: 0;
            }
            50% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-10vh) scale(1.2);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Arka plan kalpleri için kapsayıcı -->
    <div id="hearts-container"></div>

    <div class="container">
        <!-- 1. Aşama: Başlangıç Ekranı -->
        <div id="step-1" class="step">
            <h1>İMPARATORİÇE 🫀</h1>
            <p>lütfen kulaklığını tak küçük hanım</p>
            <button class="btn" onclick="nextStep(2)">Tamam</button>
        </div>

        <!-- 2. Aşama: Hemen Taktın mı? -->
        <div id="step-2" class="step hidden">
            <h1>İMPARATORİÇE 🫀</h1>
            <p>Hemen taktın mı? 😇</p>
            <div class="button-group">
                <button class="btn" onclick="handleYes()">Evet</button>
                <button class="btn btn-secondary" onclick="nextStep(3)">Hayır</button>
            </div>
        </div>

        <!-- 3. Aşama: Israr Ekranı -->
        <div id="step-3" class="step hidden">
            <h1>İMPARATORİÇE 🫀</h1>
            <p>ama çok lütfennn 🥺</p>
            <button class="btn" onclick="nextStep(2)">Tamam</button>
        </div>

        <!-- 4. Aşama: Evet Deyince Açılacak Alan (2. Etap için hazırlık) -->
        <div id="step-4" class="step hidden">
            <h1>İMPARATORİÇE 🫀</h1>
            <p>Harikasın! Sürpriz video yükleniyor...</p>
            <!-- 2. etapta buraya video oynatıcı veya indirme butonu eklenecek -->
            <a id="download-link" href="#" class="btn hidden" download="surpriz.mp4">Videoyu İndir</a>
        </div>
    </div>

    <script>
        function nextStep(stepNumber) {
            // Tüm adımları gizle
            document.querySelectorAll('.step').forEach(el => {
                el.classList.add('hidden');
            });
            // Hedef adımı göster
            document.getElementById('step-' + stepNumber).classList.remove('hidden');
        }

        function handleYes() {
            // Evet butonuna basıldığında 4. adıma geçiş
            nextStep(4);
            
            // 2. Etap için not: MP4 dosyan hazır olduğunda buraya entegre edeceğiz.
            // Örn: document.getElementById('download-link').href = 'video_dosyanin_adi.mp4';
            // document.getElementById('download-link').classList.remove('hidden');
        }

        // Arka planda uçuşan sevimli kalpler efekti
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '🫀';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = (Math.random() * 15 + 15) + 'px';
            heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
            document.getElementById('hearts-container').appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 4000);
        }

        setInterval(createHeart, 500);
    </script>
</body>
</html>
